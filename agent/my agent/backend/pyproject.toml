[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-data-agent"
version = "1.0.0"
description = "Company intranet data assistant with audited database plans"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "SQLAlchemy>=2.0,<3", "psycopg[binary,pool]>=3.2,<4", "alembic>=1.13,<2",
  "pydantic-settings>=2.5,<3", "python-multipart>=0.0.12,<1", "argon2-cffi>=23,<26",
  "httpx>=0.27,<1", "langgraph>=0.2,<2", "langgraph-checkpoint-postgres>=2,<4",
  "redis>=5,<7", "rq>=2.6,<3", "openpyxl>=3.1,<4", "python-docx>=1.1,<2",
  "docling-slim[convert-core,format-pdf]==2.135.0", "pypdfium2>=4.30,!=4.30.1,<6"
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "reportlab>=4,<5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
